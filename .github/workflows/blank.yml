<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101525">
<title>PAD WELLS STUDIO</title>
<style>
:root{--bg:#101525;--panel:#1b2338;--gold:#d8b56d;--text:#f4f2ec;--muted:#a9b1c7}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#11182a,#090d17);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:25px 15px 18px}
.logo{width:76px;height:76px;margin:auto auto 10px;border:2px solid var(--gold);border-radius:22px;display:flex;align-items:center;justify-content:center;background:#1b2338;box-shadow:0 0 25px #d8b56d25}
.logo svg{width:54px;height:54px}
h1{font-size:23px;letter-spacing:2px;margin:8px 0}
.subtitle{color:var(--muted);font-size:12px;letter-spacing:2px}
main{max-width:650px;margin:auto;padding:12px 16px 35px}
.section-title{font-size:12px;letter-spacing:2px;color:var(--gold);margin:22px 0 12px}
.status{background:var(--panel);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#72d7a0;margin-right:8px}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pad{height:115px;border:1px solid #38425c;border-radius:17px;background:linear-gradient(145deg,#252e47,#171e30);color:white;font-size:15px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 12px #0003;touch-action:manipulation}
.pad span{font-size:25px}
.pad:active,.pad.active{border-color:var(--gold);background:linear-gradient(145deg,#4a402d,#25283a);transform:scale(.98)}
.controls{background:var(--panel);padding:17px;border-radius:16px}
label{display:block;font-size:13px;margin:12px 0 8px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold)}
select,button.action{width:100%;padding:13px;border:1px solid #414b65;border-radius:10px;background:#11182a;color:white;font-size:14px}
button.action{margin-top:12px;background:#b89651;color:#111525;border:0;font-weight:bold}
footer{text-align:center;color:#7f8aa4;font-size:11px;padding:18px}
</style>
</head>
<body>
<header>
<div class="logo">
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo PAD WELLS">
<path d="M17 76V25H42C60 25 60 52 42 52H17M17 52H40" stroke="#D8B56D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M56 72V28L82 22V65" stroke="#F4F2EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="48" cy="74" rx="10" ry="7" fill="#D8B56D"/>
<ellipse cx="72" cy="66" rx="10" ry="7" fill="#D8B56D"/>
</svg>
</div>
<h1>PAD WELLS STUDIO</h1>
<div class="subtitle">WORSHIP • ATMOSPHÈRE • LOUANGE</div>
</header>

<main>
<div class="status">
<div><span class="dot"></span>Studio prêt</div>
<div id="state">Audio en attente</div>
</div>

<div class="section-title">BANQUE DE PADS</div>
<div class="pads">
<button class="pad" data-sound="pad"><span>🌌</span>Worship Pad</button>
<button class="pad" data-sound="warm"><span>✨</span>Warm Atmosphere</button>
<button class="pad" data-sound="choir"><span>🎙️</span>Choir Pad</button>
<button class="pad" data-sound="strings"><span>🎻</span>Soft Strings</button>
<button class="pad" data-sound="organ"><span>🎹</span>Organ Pad</button>
<button class="pad" data-sound="stop"><span>⏹️</span>Tout arrêter</button>
</div>

<div class="section-title">CONTRÔLES AUDIO</div>
<div class="controls">
<label for="volume">Volume général</label>
<input id="volume" type="range" min="0" max="100" value="65">
<label for="tone">Ambiance sonore</label>
<select id="tone">
<option value="soft">Douce et calme</option>
<option value="bright">Brillante</option>
<option value="deep">Profonde</option>
</select>
<button class="action" id="stop">ARRÊTER TOUS LES SONS</button>
</div>
<footer>PAD WELLS STUDIO · Version 1.0</footer>
</main>

<script>
let ctx=null;
let master=null;
let active=[];
function initAudio(){
 if(!ctx){
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();
  master.gain.value=Number(document.getElementById('volume').value)/100;
  master.connect(ctx.destination);
 }
 if(ctx.state==='suspended')ctx.resume();
}
function stopAll(){
 active.forEach(item=>{
  try{item.gain.gain.cancelScheduledValues(ctx.currentTime);item.gain.gain.setTargetAtTime(0,ctx.currentTime,.15);item.osc.stop(ctx.currentTime+.6)}catch(e){}
 });
 active=[];
 document.querySelectorAll('.pad').forEach(p=>p.classList.remove('active'));
 document.getElementById('state').textContent='Audio arrêté';
}
function playPad(type,button){
 initAudio();
 if(type==='stop'){stopAll();return}
 stopAll();
 const settings={
  pad:[130.81,164.81,196,261.63],
  warm:[110,164.81,220],
  choir:[196,246.94,293.66,392],
  strings:[146.83,220,293.66],
  organ:[130.81,196,261.63]
 };
 const freqs=settings[type]||settings.pad;
 const tone=document.getElementById('tone').value;
 const now=ctx.currentTime;
 freqs.forEach((freq,i)=>{
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const filter=ctx.createBiquadFilter();
  osc.type=type==='organ'?'sine':(type==='strings'?'triangle':'sine');
  let multiplier=tone==='bright'?1.5:tone==='deep'?.7:1;
  osc.frequency.value=freq*multiplier;
  filter.type='lowpass';
  filter.frequency.value=tone==='bright'?1800:900;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(.12/(i+1),now+1.5);
  osc.connect(filter);filter.connect(gain);gain.connect(master);
  osc.start();
  active.push({osc,gain});
 });
 button.classList.add('active');
 document.getElementById('state').textContent='Pad en lecture';
}
document.querySelectorAll('.pad').forEach(button=>{
 button.addEventListener('click',()=>playPad(button.dataset.sound,button));
});
document.getElementById('stop').addEventListener('click',stopAll);
document.getElementById('volume').addEventListener('input',e=>{
 if(master)master.gain.setTargetAtTime(Number(e.target.value)/100,ctx.currentTime,.05);
});
</script>
</body>
</html>
